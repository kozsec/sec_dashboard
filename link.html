<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Link by koz</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header>
    <div class="container header-inner">
        <div class="brand">

            <div class="brand-mark">
                <img src="asset/movi.png">
            </div>

            <div class="brand-text">

                <div class="brand-title">
                    Security Link by koz
                </div>

                <div class="brand-subtitle">
                    セキュリティ関連のリンクを集めます（手動）
                </div>

            </div>

        </div>
    </div>
</header>

    <main>
        <div class="container">
        
            <!-- Ad -->
            <div id="original-ad"></div>
            
            <details class="cvss-vector-section">
            <summary>Vulnerability Management</summary>
            <div class="cvss-vector-columns"><div class="cvss-vector-description">
                <p><a href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog">Known Exploited Vulnerabilities Catalog</a> - CISA</p>
                <p><a href="https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk">CISA BOD 26-04</a> - CISA</p>
            </div></div>
            </details>

            <details class="cvss-vector-section">
            <summary>IT-BCP</summary>
            <div class="cvss-vector-columns"><div class="cvss-vector-description">
                <p><a href="https://www.ipa.go.jp/archive/files/000004631.pdf">事業継続のための高回復力システム基盤導入ガイド 概要編</a> - IPA</p>
            </div></div>
            </details>

            <details class="cvss-vector-section">
            <summary>Certifications</summary>
            <div class="cvss-vector-columns"><div class="cvss-vector-description">
                <p><a href="https://www.isaca.org/">ISACA</a></p>
                <p><a href="https://www.isc2.org/">ISC2</a></p>
            </div></div>
            </details>

        </div>
    </main>

<div id="bottom-nav"></div>

<script src="js/menu.js"></script>

</body>
</html>
